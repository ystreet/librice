header = "// SPDX-License-Identifier: MIT OR Apache-2.0"
includes = ["rice-proto-config.h"]
include_guard = "LIBRICE_PROTO_H"
tab_width = 4
language = "C"
cpp_compat = true
usize_is_size_t = true

[export]
exclude = ["MAGIC_COOKIE", "BINDING", "RTP", "RTCP"]
item_types = ["enums", "structs", "opaque", "functions"]

[export.rename]
"CandidateType" = "RiceCandidateType"
"ComponentConnectionState" = "RiceComponentConnectionState"

[fn]
args = "vertical"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[defines]
"feature = openssl" = "RICE_PROTO_OPENSSL"
"feature = rustls" = "RICE_PROTO_RUSTLS"
"feature = dimpl" = "RICE_PROTO_DIMPL"
