name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      matrix:
        toolchain: ['1.85', stable]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
        features:
          - "--no-default-features"
        include:
          - runs-on: ubuntu-latest
            features: "--all-features"
            toolchain: '1.85'
          - runs-on: ubuntu-latest
            features: "--all-features"
            toolchain: stable

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v2
    - name: Install cargo-c
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: cargo-c
    - name: Install ${{ matrix.toolchain }}
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: ${{ matrix.toolchain }}
        override: true
    - name: Install pkg-config
      shell: pwsh
      run: |
        $pkgconfigDir = "${{ runner.temp }}\pkgconfig"
        New-Item -ItemType Directory -Path $pkgconfigDir -Force
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mesonbuild/cidata/refs/heads/master/win32/pkg-config.exe" -OutFile "$pkgconfigDir\pkg-config.exe"
        echo "$pkgconfigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      if: matrix.runs-on == 'windows-latest'
    - run: brew install pkgconf
      if: matrix.runs-on == 'macos-latest'
    - name: Build using MSRV
      run: cp Cargo.lock.msrv Cargo.lock && cargo build --locked --verbose ${{ matrix.features }}
      if: matrix.toolchain == '1.85'
    - name: Build
      run: cargo build --verbose ${{ matrix.features }}
      if: matrix.toolchain != '1.85'
  test:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v2
    - name: Install cargo-c
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: cargo-c
    - name: Install pkg-config
      shell: pwsh
      run: |
        $pkgconfigDir = "${{ runner.temp }}\pkgconfig"
        New-Item -ItemType Directory -Path $pkgconfigDir -Force
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mesonbuild/cidata/refs/heads/master/win32/pkg-config.exe" -OutFile "$pkgconfigDir\pkg-config.exe"
        echo "$pkgconfigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      if: matrix.runs-on == 'windows-latest'
    - run: brew install pkgconf
      if: matrix.runs-on == 'macos-latest'
    - name: Run tests
      run: cargo test --verbose --all-features
      if: matrix.runs-on == 'ubuntu-latest'
    - name: Run tests (No default features + Tokio)
      run: cargo test --verbose --no-default-features --features runtime-tokio
    - name: Run tests (No default features + Smol)
      run: cargo test --verbose --no-default-features --features runtime-smol
    - name: Run tests (No default features + openssl)
      run: cargo test --verbose --no-default-features --features runtime-smol,openssl
      if: matrix.runs-on == 'ubuntu-latest'
    - name: Run tests (No default features + rustls)
      run: cargo test --verbose --no-default-features --features runtime-smol,rustls
    - name: Run tests (No default features + dimpl)
      run: cargo test --verbose --no-default-features --features runtime-smol,dimpl
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install cargo-c
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: cargo-c
    - name: clippy
      run: cargo clippy --verbose --all-features -- -Dwarnings
