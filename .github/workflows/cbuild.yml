name: C Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v2
    - name: Install cargo-c
      uses: taiki-e/cache-cargo-install-action@v2 
      with:
        tool: cargo-c
    - name: CBuild rice-proto
      run: cargo cbuild -p rice-proto --verbose --no-default-features
    - name: CBuild rice-io
      run: cargo cbuild -p rice-io --verbose --no-default-features
  test:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v2
    - name: Install cargo-c
      uses: taiki-e/cache-cargo-install-action@v2 
      with:
        tool: cargo-c
    - name: Install pkg-config
      shell: pwsh
      run: |
        $pkgconfigDir = "${{ runner.temp }}\pkgconfig"
        New-Item -ItemType Directory -Path $pkgconfigDir -Force
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mesonbuild/cidata/refs/heads/master/win32/pkg-config.exe" -OutFile "$pkgconfigDir\pkg-config.exe"
        echo "$pkgconfigDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      if: matrix.runs-on == 'windows-latest'
    - name: CTest rice-proto
      run: cargo ctest -p rice-proto --verbose --no-default-features
    - name: CTest rice-io
      run: cargo ctest -p rice-io --verbose --no-default-features
